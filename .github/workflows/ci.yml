name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install -r tools/requirements.txt

      - name: Schema lint (packs/*/*/festpack.json against schema/festpack.schema.json)
        run: python3 tools/lint_schema.py

      - name: packs/index.json drift check
        run: python3 tools/build_index.py --check
